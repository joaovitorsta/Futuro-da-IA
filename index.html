<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visão 2049: O Amanhã da IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="decoracao-fundo"></div>
    <main class="container-app">
        <header class="topo-app">
            <span class="badge-tema">Projeto 2049</span>
            <h1 class="titulo-destaque">Você Decide o Futuro da IA</h1>
            <div class="medidor-avanco">
                <div class="status-avanco">
                    <span id="indicador-etapa">Fase 1 / 4</span>
                    <span id="indicador-percentual">0%</span>
                </div>
                <div class="trilha-avanco">
                    <div class="preenchimento-avanco" id="preenchimento-avanco"></div>
                </div>
            </div>
        </header>

        <section class="area-interativa" id="area-interativa">
            <div class="painel-pergunta" id="painel-pergunta"></div>
            <div class="painel-opcoes" id="painel-opcoes"></div>
        </section>

        <section class="area-conclusao oculta" id="area-conclusao">
            <div class="simbolo-conclusao">🌐</div>
            <h2 class="titulo-conclusao">Seu Destino Tecnológico</h2>
            <p class="paragrafo-conclusao" id="paragrafo-conclusao"></p>
            <button class="btn-reiniciar" id="btn-reiniciar">
                <span>Refazer Escolhas</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M2.1 12a9 9 0 0 0 15 6.7l4.4-4.7M2.5 22v-6h6M21.9 12a9 9 0 0 0-15-6.7L2.5 10"/></svg>
            </button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
